apply plugin: 'com.android.application'

android {
    namespace "com.privatgo"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.privatgo.student"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "role"
    productFlavors {
        student {
            dimension "role"
            applicationId "com.privatgo.student"
            versionNameSuffix "-siswa"
            resValue "string", "app_name", "PrivatGo Siswa"
        }
        tutor {
            dimension "role"
            applicationId "com.privatgo.tutor"
            versionNameSuffix "-tutor"
            resValue "string", "app_name", "PrivatGo Tutor"
        }
        parent {
            dimension "role"
            applicationId "com.privatgo.parent"
            versionNameSuffix "-ortu"
            resValue "string", "app_name", "PrivatGo Orang Tua"
        }
        admin {
            dimension "role"
            applicationId "com.privatgo.admin"
            versionNameSuffix "-admin"
            resValue "string", "app_name", "PrivatGo Admin"
        }
        finance {
            dimension "role"
            applicationId "com.privatgo.finance"
            versionNameSuffix "-finance"
            resValue "string", "app_name", "PrivatGo Finance"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}
