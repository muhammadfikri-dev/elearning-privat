<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"/>
  
  <!-- Graduation Cap / Book Icon -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Mortarboard Top Diamond -->
    <polygon points="256,120 400,195 256,270 112,195" fill="url(#cap-grad)" />
    <!-- Cap Underneath Base -->
    <path d="M168,230 L168,295 C168,345 344,345 344,295 L344,230 L256,275 Z" fill="#EEF2FF" />
    <!-- Tassel -->
    <path d="M380,205 L400,270 L390,275 L375,210 Z" fill="#FBBF24" />
    <circle cx="395" cy="275" r="8" fill="#F59E0B" />
    
    <!-- Open Glowing Book underneath -->
    <path d="M140,360 Q256,330 256,380 Q256,330 372,360 L372,400 Q256,370 256,420 Q256,370 140,400 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Sparkles -->
    <polygon points="130,150 135,165 150,170 135,175 130,190 125,175 110,170 125,165" fill="#FDE047"/>
    <polygon points="380,130 384,142 396,146 384,150 380,162 376,150 364,146 376,142" fill="#FDE047"/>
  </g>
</svg>
