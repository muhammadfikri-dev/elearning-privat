name: Build 5 Native Android APKs

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apks:
    name: Compile 5 Dedicated Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Compile 5 Flavor APKs with Native Gradle
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Organize APK Files
        run: |
          mkdir -p final-apks
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} final-apks/ \;
          ls -la final-apks/

      - name: Upload 5 Native APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivatGo-5-Native-APKs
          path: final-apks/*.apk
          retention-days: 30

      - name: Attach 5 APKs to GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: final-apks/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
